name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove candidate names or tokens that must remain private.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include command, expected state, actual state, and sanitized output.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Mode
      options: [offline, online, both]
    validations:
      required: true
